name: st3d
channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy<2  # pinned: installed torch build is compiled against NumPy 1.x ABI
  - scipy
  - pandas
  - scikit-learn
  - scikit-image
  - matplotlib
  - seaborn
  - jupyterlab
  - pytorch
  - torchvision
  - pytorch-cuda=12.1   # remove/adjust if no GPU or different CUDA version
  - pytorch-lightning
  - anndata
  - scanpy
  - squidpy
  - h5py
  - zarr
  - python-igraph   # sc.tl.leiden backend (src/evaluation/cell_type_classifier.py)
  - leidenalg       # sc.tl.leiden backend
  - pip:
      - spatialdata
      - spatialdata-io
      - wandb
      - hydra-core
      - omegaconf
      - einops
      - diffusers
      - torchmetrics
      - POT            # optimal transport, useful for slice alignment (PASTE-style) and metrics
      # anndata2ri removed 2026-07-15: not referenced anywhere in src/tests/docs (grepped to
      # confirm) - it was speculative R-interop that was never actually used, and its rpy2
      # dependency requires R installed system-wide to build from source. Blocked env creation
      # on a fresh server that doesn't have R. Re-add (with R available) only if something
      # actually needs it later.
      # - timm  # optional, only for image_encoder_type="gigapath" - needs a HuggingFace
      #         # account with access GRANTED to the gated prov-gigapath/prov-gigapath
      #         # repo; uncomment + pip install once you have that access (see
      #         # conditioning.py GigapathPatchEncoder)
