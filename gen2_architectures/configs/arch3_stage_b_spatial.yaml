# Architecture 3, Stage B -- spatial transformer predicting a LATENT code,
# decoded via Stage A's autoencoder (arch3_stage_a_pretrain.yaml -- MUST be
# run first; point model.stage_a_checkpoint_dir at that run's
# training.checkpoint_dir). GPT's own favorite of the 4 architectures.
#
# [data] below is intentionally IDENTICAL to arch3_stage_a_pretrain.yaml's
# [data] section (same data.sample_selection block -> same resolved gene
# panel -- see that file's own note on why this MUST match exactly).
experiment_name: gen2_arch3_stage_b_spatial_v1
data:
  hest_data_dir: data/raw/hest1k
  hest_cache_dir: data/cache/hest1k
  min_genes: 200
  min_cells: 3
  expression_transform: normalize_log1p
  expression_target_sum: 10000.0
  sample_selection:
    organs: all
    metadata_csv: hf://datasets/MahmoodLab/hest/HEST_v1_3_0.csv
    min_samples_per_organ: 5
    max_samples_per_organ: 30
    n_validation_per_organ: 2
    n_test_per_organ: 2
    split_seed: 0
masking:
  strategy: random_dropout_patches
  max_context_points: 80
  context_selection: nearest_query
  params:
    n_patches: 1
    radius_range: [5.0, 8.0]
    radius_unit: spot_spacing
    shape: mixed
model:
  # Fill in with arch3_stage_a_pretrain.yaml's own training.checkpoint_dir
  # once that run has completed.
  stage_a_checkpoint_dir: gen2_architectures/results/arch3_stage_a_pretrain
  params:
    finetune_autoencoder: false   # GPT review answer #2: start frozen; a config override can set this true for an ablation
    autoencoder_lr_multiplier: 0.1   # only matters if finetune_autoencoder: true -- fine-tune at 10x smaller LR than the transformer
    feat_dim: 256
    coord_dim: 64
    conf_dim: 16
    hidden_dim: 512
    n_layers: 8
    n_heads: 8
    mlp_ratio: 4.0
    dropout: 0.1
    max_neighbors: 80
    coord_scale: 1000.0
    # organ_vocab/tech_vocab auto-injected at run time from
    # data.sample_selection -- see training/data_prep.py::apply_sample_selection.
training:
  device: cuda
  seed: 0
  lr: 1.0e-4
  total_steps: 100000   # placeholder -- see README section 7
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  checkpoint_every_n_steps: 2000
  eval_every_n_steps: 5000
  checkpoint_dir: gen2_architectures/results/arch3_stage_b_spatial
  image_mode: target_zero
  context_gex_mode: full
  augment_coords: true
  latent_loss_weight: 1.0   # weight on the teacher-forced latent-space MSE term, added to the staged gene-space loss below
  loss:
    stage1_end: 0.2
    stage2_end: 0.6
    stage2_pearson_weight: 0.1
    stage3_pearson_weight: 0.3
evaluation:
  mask_bank_dir: gen2_architectures/results/mask_banks/arch3_stage_b_spatial
  n_validation_masks: 8
  n_test_masks: 16
  validation_seed: 761000
  test_seed: 961000
  sampling_seed: 1261000
  n_samples: 1
  primary_image_mode: target_zero
  image_modes: [target_zero, all_zero]
  k_neighborhood: 8
  pca_n_components: 50
  # No fixed_gene_panel_paths -- see arch1_gpt_baseline.yaml's own note.
