# Architecture 2 -- scFoundation as the gene encoder (GPT's #1-ranked
# pretrained option). Same local-neighborhood transformer/image encoder as
# Architecture 1; the gene encoder is a frozen scFoundation checkpoint
# instead of a from-scratch MLP. See gen2_architectures/README.md.
#
# REQUIRES scfoundation_repo_path/scfoundation_model_path below to point to
# a real `git clone https://github.com/biomap-research/scFoundation` and
# its downloaded checkpoint (SharePoint link in the upstream README) --
# CUDA-only (load_model_frommmf hardcodes .cuda()). This is the FIRST real
# run of this project's scFoundation integration on live hardware -- if it
# fails, that's a legitimate, expected finding to report, not a sign the
# plan was wrong (see README's open-risk note on Architecture 2).
#
# Sample scope: IDENTICAL data.sample_selection block to
# arch1_gpt_baseline.yaml -- keeps Arch1-vs-Arch2 a fair, same-data
# comparison (see that file's own comment for the reasoning).
experiment_name: gen2_arch2_scfoundation_v1
data:
  strict_broken_region: true   # 2026-07-27, GPT-audit-flagged: without this, context H&E patches near the mask boundary could still contain real pixels from inside the supposedly destroyed query region -- excludes every context patch whose pixels overlap it, not just the query patches themselves (only takes effect when training.image_mode/evaluation.primary_image_mode is target_zero)
  hest_data_dir: data/raw/hest1k
  hest_cache_dir: data/cache/hest1k
  min_genes: 200
  min_cells: 3
  expression_transform: normalize_log1p
  expression_target_sum: 10000.0
  scfoundation_repo_path: ${oc.env:SCFOUNDATION_REPO_PATH}
  scfoundation_model_path: ${oc.env:SCFOUNDATION_MODEL_PATH}
  sample_selection:
    organs: all
    metadata_csv: hf://datasets/MahmoodLab/hest/HEST_v1_3_0.csv
    min_samples_per_organ: 5
    max_samples_per_organ: 30
    n_validation_per_organ: 2
    n_test_per_organ: 2
    split_seed: 0
masking:
  strategy: random_dropout_patches
  max_context_points: 80
  context_selection: nearest_query
  params:
    n_patches: 1
    radius_range: [5.0, 8.0]
    radius_unit: spot_spacing
    shape: mixed
model:
  architecture: "2"
  params:
    feat_dim: 256
    coord_dim: 64
    conf_dim: 16
    hidden_dim: 512
    n_layers: 8
    n_heads: 8
    mlp_ratio: 4.0
    dropout: 0.1
    max_neighbors: 80
    decoder_hidden_dim: 1024
    # coord_scale/organ_vocab/tech_vocab auto-injected at run time from
    # the real training data -- see
    # training/data_prep.py::apply_coord_scale/apply_sample_selection.
    # scfoundation_dim is NOT set here -- it's auto-detected at runtime from
    # a real probe call against the loaded checkpoint (see
    # train_local_neighborhood.py's data_prep._probe_context_feature_dim),
    # never hardcoded/guessed.
training:
  device: cuda
  seed: 0
  lr: 1.0e-4
  total_steps: 100000000   # hard safety cap only, deliberately far above any real run's reach (2026-07-25: 1,000,000 was too low -- a fast architecture could exhaust it in a few hours, ending the run early despite max_wall_clock_hours below, the real practical stopping point (README section 12)
  max_wall_clock_hours: 24   # lowered from 36h 2026-07-26, user call
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  checkpoint_every_n_steps: 2000
  checkpoint_keep_last: 2   # step-numbered history + rollback (README section 13) -- 50GB total server budget, tune down if disk gets tight
  eval_every_n_steps: 100000000   # periodic in-training eval skipped (2026-07-26, user call) -- only the final held-out test evaluation runs now
  checkpoint_dir: gen2_architectures/results/arch2_scfoundation
  image_mode: target_zero
  context_gex_mode: full
  augment_coords: true
  loss:
    stage1_end: 0.2
    stage2_end: 0.6
    stage2_pearson_weight: 0.1
    stage3_pearson_weight: 0.3
evaluation:
  spatial_domain_plausibility: false   # disabled 2026-07-26 -- 16 sequential RandomForestClassifier fits on a ~17k-gene panel made real-server evaluations take many minutes even single-job; this is a secondary diagnostic, not one of the core metrics (PCC/RMSE/ST-FID/ST-MMD are untouched)
  compute_st_fid_mmd: true   # re-enabled 2026-07-27, user call -- the earlier slowness (uncapped BLAS threading in the PCA fit) and the numerical-instability bug (near-singular covariance producing garbage negative "FID" values) are both fixed now, see _fixed_pca/_fid_n_components' own docstrings
  mask_bank_dir: gen2_architectures/results/mask_banks/arch2_scfoundation
  n_validation_masks: 8
  n_test_masks: 16
  validation_seed: 761000
  test_seed: 961000
  sampling_seed: 1261000
  n_samples: 1
  primary_image_mode: target_zero
  image_modes: [target_zero, all_zero]
  k_neighborhood: 8
  pca_n_components: 50
  # No fixed_gene_panel_paths -- see arch1_gpt_baseline.yaml's own note.
