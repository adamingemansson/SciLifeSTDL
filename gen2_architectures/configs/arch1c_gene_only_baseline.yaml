# Gene-only baseline (completes GPT review suggestion #8's 3-way
# decomposition, alongside arch1_gpt_baseline.yaml and
# arch1b_image_only_baseline.yaml): identical to Architecture 1 EXCEPT
# image_mode: all_zero below, which removes H&E entirely (both context and
# query images) while keeping gene expression fully observed. GPT's review
# noted a gene-only baseline already effectively exists elsewhere in this
# repo (the harmonic model) -- this variant exists anyway so all three
# points of the decomposition share the exact same architecture/capacity,
# for a cleaner apples-to-apples comparison than harmonic (a structurally
# different model) would give.
#
# Sample scope: IDENTICAL data.sample_selection block to
# arch1_gpt_baseline.yaml -- see that file's own comment for the reasoning.
experiment_name: gen2_arch1c_gene_only_baseline_v1
data:
  hest_data_dir: data/raw/hest1k
  hest_cache_dir: data/cache/hest1k
  min_genes: 200
  min_cells: 3
  expression_transform: normalize_log1p
  expression_target_sum: 10000.0
  sample_selection:
    organs: all
    metadata_csv: hf://datasets/MahmoodLab/hest/HEST_v1_3_0.csv
    min_samples_per_organ: 5
    max_samples_per_organ: 30
    n_validation_per_organ: 2
    n_test_per_organ: 2
    split_seed: 0
masking:
  strategy: random_dropout_patches
  max_context_points: 80
  context_selection: nearest_query
  params:
    n_patches: 1
    radius_range: [5.0, 8.0]
    radius_unit: spot_spacing
    shape: mixed
model:
  architecture: "1"
  params:
    feat_dim: 256
    coord_dim: 64
    conf_dim: 16
    hidden_dim: 512
    n_layers: 8
    n_heads: 8
    mlp_ratio: 4.0
    dropout: 0.1
    max_neighbors: 80
    decoder_hidden_dim: 1024
    # coord_scale/organ_vocab/tech_vocab auto-injected at run time from
    # the real training data -- see
    # training/data_prep.py::apply_coord_scale/apply_sample_selection.
training:
  device: cuda
  seed: 0
  lr: 1.0e-4
  total_steps: 100000000   # hard safety cap only, deliberately far above any real run's reach (2026-07-25: 1,000,000 was too low -- a fast architecture could exhaust it in a few hours, ending the run early despite max_wall_clock_hours below, the real practical stopping point (README section 12)
  max_wall_clock_hours: 12   # shorter than arch1_gpt_baseline.yaml's 36h -- this ablation exists to help
  # INTERPRET the primary comparison (README section 8), not to be trained as deeply as it; run via
  # train_local_neighborhood_sequential.py chained after Architecture 1 (README section 10)
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  checkpoint_every_n_steps: 2000
  checkpoint_keep_last: 2   # step-numbered history + rollback (README section 13) -- 50GB total server budget, tune down if disk gets tight
  eval_every_n_steps: 100000000   # periodic in-training eval skipped (2026-07-26, user call) -- only the final held-out test evaluation runs now
  checkpoint_dir: gen2_architectures/results/arch1c_gene_only_baseline
  image_mode: all_zero   # THE ablation: no image signal at all, gene-only
  context_gex_mode: full
  augment_coords: true
  loss:
    stage1_end: 0.2
    stage2_end: 0.6
    stage2_pearson_weight: 0.1
    stage3_pearson_weight: 0.3
evaluation:
  spatial_domain_plausibility: false   # disabled 2026-07-26 -- 16 sequential RandomForestClassifier fits on a ~17k-gene panel made real-server evaluations take many minutes even single-job; this is a secondary diagnostic, not one of the core metrics (PCC/RMSE/ST-FID/ST-MMD are untouched)
  compute_st_fid_mmd: true   # re-enabled 2026-07-27, user call -- see _fixed_pca's own docstring for the still-unresolved slowness this may reproduce
  # Same mask_bank_dir as arch1_gpt_baseline.yaml/arch1b (identical masking
  # config -> identical held-out masks) so the 3-way decomposition compares
  # the same held-out regions across all three variants.
  mask_bank_dir: gen2_architectures/results/mask_banks/arch1_gpt_baseline
  n_validation_masks: 8
  n_test_masks: 16
  validation_seed: 761000
  test_seed: 961000
  sampling_seed: 1261000
  n_samples: 1   # deterministic regressor, see models/eval_compat.py -- n_samples>1 would just repeat the same prediction
  # all_zero, not target_zero: this variant trains with image_mode: all_zero
  # (no image signal at all, context included) -- evaluating under
  # target_zero would suddenly show it CONTEXT images it never learned to
  # use, an inconsistent train/eval condition.
  primary_image_mode: all_zero
  image_modes: [all_zero]
  k_neighborhood: 8
  pca_n_components: 50
  # No fixed_gene_panel_paths -- see arch1_gpt_baseline.yaml's own note.
