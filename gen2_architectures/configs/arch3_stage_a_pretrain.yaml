# Architecture 3, Stage A -- self-supervised DENOISING transcriptome
# autoencoder pretraining (GPT review suggestion #3). Run this FIRST, then
# point arch3_stage_b_spatial.yaml's model.stage_a_checkpoint_dir at this
# run's training.checkpoint_dir below. No images, no masking, no
# context/query split -- pure expression -> expression reconstruction on
# every observed spot from every training slide. Cheap relative to Stage B
# (train_arch3_stage_b.py) -- expect this to finish well within the
# combined 1-2 day budget for the pair.
#
# IMPORTANT: Stage A and Stage B MUST share the exact same
# data.sample_selection block (i.e. the exact same resolved train_sample_ids
# and therefore the exact same shared gene panel and expression values) --
# train_arch3_stage_b.py checks the gene COUNT matches and raises if not,
# but cannot verify gene IDENTITY/order matches beyond that, so keep this
# file and arch3_stage_b_spatial.yaml's [data] section identical by
# construction (they already are below). Sample scope: same organs/caps as
# arch1_gpt_baseline.yaml -- see that file's own comment for the reasoning.
# Note Stage A only ever uses train_sample_ids (pools every observed spot,
# no context/query split) -- resolve_sample_selection still computes
# validation/test_sample_ids here too, just unused, so the SAME block can
# be copy-pasted into Stage B unchanged.
experiment_name: gen2_arch3_stage_a_pretrain_v1
data:
  hest_data_dir: data/raw/hest1k
  hest_cache_dir: data/cache/hest1k
  min_genes: 200
  min_cells: 3
  expression_transform: normalize_log1p
  expression_target_sum: 10000.0
  sample_selection:
    organs: all
    metadata_csv: hf://datasets/MahmoodLab/hest/HEST_v1_3_0.csv
    min_samples_per_organ: 5
    max_samples_per_organ: 30
    n_validation_per_organ: 2
    n_test_per_organ: 2
    split_seed: 0
model:
  params:
    latent_dim: 256
    hidden_dims: [4096, 1024]
training:
  device: cuda
  seed: 0
  lr: 1.0e-4
  total_steps: 1000000   # hard safety cap only -- see max_wall_clock_hours below
  max_wall_clock_hours: 8   # standalone-run fallback; when launched via training/train_arch3_combined.py this is OVERRIDDEN by --total_hours * stage_a_fraction (default 20% of the pair's combined budget, README section 12)
  batch_size: 256
  gradient_clip_val: 1.0
  log_every_n_steps: 100
  checkpoint_every_n_steps: 5000
  checkpoint_keep_last: 1   # this checkpoint's size scales with the shared gene panel width (README section 13) -- kept tighter than the other 6 configs given the 50GB total server budget
  checkpoint_dir: gen2_architectures/results/arch3_stage_a_pretrain
  mask_fraction: 0.2   # GPT's suggested 20% per-row gene masking
  gaussian_std: 0.0    # additive Gaussian noise on top of masking; 0.0 = masking only
  loss:
    stage1_end: 0.2
    stage2_end: 0.6
    stage2_pearson_weight: 0.1
    stage3_pearson_weight: 0.3
