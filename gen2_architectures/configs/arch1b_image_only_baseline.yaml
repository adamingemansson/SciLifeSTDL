# Image-only baseline (GPT review suggestion #8): identical to
# Architecture 1 in every respect EXCEPT context_gex_mode: zero below,
# which removes gene expression from every context spot (both the raw
# expression channel and any additive channel) while keeping H&E images
# fully observed. Answers "how much information is actually contained in
# H&E alone?" -- compare against arch1_gpt_baseline.yaml (image+genes) and
# arch1c_gene_only_baseline.yaml (genes only, image_mode: all_zero) for
# the full 3-way decomposition GPT's review asked for. Same architecture,
# same parameter count, same capacity -- only modality availability
# differs, so the comparison isolates information content rather than
# confounding it with a different model.
#
# Sample scope: IDENTICAL data.sample_selection block to
# arch1_gpt_baseline.yaml (same organs/caps/split_seed) -- resolves to the
# exact same train/validation/test sample IDs deterministically, so this
# ablation compares against the real Architecture 1 on the same data, not
# a different sample scope. See arch1_gpt_baseline.yaml's own comment for
# the reasoning behind these specific numbers.
experiment_name: gen2_arch1b_image_only_baseline_v1
data:
  hest_data_dir: data/raw/hest1k
  hest_cache_dir: data/cache/hest1k
  min_genes: 200
  min_cells: 3
  expression_transform: normalize_log1p
  expression_target_sum: 10000.0
  sample_selection:
    organs: all
    metadata_csv: hf://datasets/MahmoodLab/hest/HEST_v1_3_0.csv
    min_samples_per_organ: 5
    max_samples_per_organ: 30
    n_validation_per_organ: 2
    n_test_per_organ: 2
    split_seed: 0
masking:
  strategy: random_dropout_patches
  max_context_points: 80
  context_selection: nearest_query
  params:
    n_patches: 1
    radius_range: [5.0, 8.0]
    radius_unit: spot_spacing
    shape: mixed
model:
  architecture: "1"
  params:
    feat_dim: 256
    coord_dim: 64
    conf_dim: 16
    hidden_dim: 512
    n_layers: 8
    n_heads: 8
    mlp_ratio: 4.0
    dropout: 0.1
    max_neighbors: 80
    coord_scale: 1000.0   # verify against this dataset's real coordinate spread before launching -- see README
    decoder_hidden_dim: 1024
    # organ_vocab/tech_vocab auto-injected at run time from
    # data.sample_selection -- see training/data_prep.py::apply_sample_selection.
training:
  device: cuda
  seed: 0
  lr: 1.0e-4
  total_steps: 100000   # placeholder -- see README section 7 for how to derive a real budget from a smoke run's steps/sec
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  checkpoint_every_n_steps: 2000
  eval_every_n_steps: 5000
  checkpoint_dir: gen2_architectures/results/arch1b_image_only_baseline
  image_mode: target_zero
  context_gex_mode: zero   # THE ablation: no gene expression signal at all, image-only
  augment_coords: true
  loss:
    stage1_end: 0.2
    stage2_end: 0.6
    stage2_pearson_weight: 0.1
    stage3_pearson_weight: 0.3
evaluation:
  # Deliberately the SAME mask bank dir as arch1_gpt_baseline.yaml (identical
  # masking config -> identical held-out masks, keyed by sample_id) -- the
  # 3-way image/gene/both decomposition needs the SAME held-out regions
  # across all three variants, otherwise a PCC difference could reflect
  # "different masks happened to be harder," not modality availability.
  mask_bank_dir: gen2_architectures/results/mask_banks/arch1_gpt_baseline
  n_validation_masks: 8
  n_test_masks: 16
  validation_seed: 761000
  test_seed: 961000
  sampling_seed: 1261000
  n_samples: 1   # deterministic regressor, see models/eval_compat.py -- n_samples>1 would just repeat the same prediction
  primary_image_mode: target_zero
  image_modes: [target_zero, all_zero]
  k_neighborhood: 8
  pca_n_components: 50
  # No fixed_gene_panel_paths -- see arch1_gpt_baseline.yaml's own note
  # (multi-organ run, full-panel PCC/RMSE is the organ-agnostic metric).
