# Architecture 1 -- "GPT-v1 faithful": small local-neighborhood
# transformer, from-scratch MLP gene encoder, frozen GigaPath image
# encoder. See gen2_architectures/README.md for the full spec.
#
# Sample scope resolved at run time from the real HEST-1k Visium inventory
# (gen2_architectures/data/hest1k_catalog.py::resolve_sample_selection,
# via data.sample_selection below) rather than a hardcoded ID list --
# real inventory (2026-07-25, scripts/inventory_hest1k.py against the
# actual server): ~515 usable Visium samples across ~24 organs already
# downloaded. min_samples_per_organ=5 keeps only organs with a real
# train/val/test split; max_samples_per_organ=30 caps the largest organs
# (Brain: 121, Skin/Kidney: 67 each, ...) so epoch size stays tractable
# for a 1-2 day budget while still getting real multi-organ diversity --
# ~17 organs, ~240 training samples with these settings. Tune
# max_samples_per_organ up/down after a smoke run shows real steps/sec.
experiment_name: gen2_arch1_gpt_baseline_v1
data:
  hest_data_dir: data/raw/hest1k
  hest_cache_dir: data/cache/hest1k
  min_genes: 200
  min_cells: 3
  expression_transform: normalize_log1p
  expression_target_sum: 10000.0
  sample_selection:
    organs: all
    metadata_csv: hf://datasets/MahmoodLab/hest/HEST_v1_3_0.csv
    min_samples_per_organ: 5
    max_samples_per_organ: 30
    n_validation_per_organ: 2
    n_test_per_organ: 2
    split_seed: 0
masking:
  strategy: random_dropout_patches
  max_context_points: 80
  context_selection: nearest_query
  params:
    n_patches: 1
    radius_range: [5.0, 8.0]
    radius_unit: spot_spacing
    shape: mixed
model:
  architecture: "1"
  params:
    feat_dim: 256
    coord_dim: 64
    conf_dim: 16
    hidden_dim: 512
    n_layers: 8
    n_heads: 8
    mlp_ratio: 4.0
    dropout: 0.1
    max_neighbors: 80
    decoder_hidden_dim: 1024
    # coord_scale, organ_vocab, tech_vocab are NOT set here -- all three
    # are auto-injected at run time from the real resolved training data
    # (training/data_prep.py::apply_sample_selection for organ_vocab/
    # tech_vocab, ::apply_coord_scale for coord_scale, ported from the
    # exact real-data-derivation formula src/training/train.py already
    # uses). Set any of them explicitly only to override the auto-detected
    # value.
training:
  device: cuda
  seed: 0
  lr: 1.0e-4
  total_steps: 100000   # placeholder -- see README section 7 for how to derive a real budget from a smoke run's steps/sec
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  checkpoint_every_n_steps: 2000
  checkpoint_keep_last: 2   # step-numbered history + rollback (README section 13) -- 50GB total server budget, tune down if disk gets tight
  eval_every_n_steps: 5000
  checkpoint_dir: gen2_architectures/results/arch1_gpt_baseline
  image_mode: target_zero
  context_gex_mode: full
  augment_coords: true
  loss:
    stage1_end: 0.2
    stage2_end: 0.6
    stage2_pearson_weight: 0.1
    stage3_pearson_weight: 0.3
evaluation:
  mask_bank_dir: gen2_architectures/results/mask_banks/arch1_gpt_baseline
  n_validation_masks: 8
  n_test_masks: 16
  validation_seed: 761000
  test_seed: 961000
  sampling_seed: 1261000
  n_samples: 1   # deterministic regressor, see models/eval_compat.py -- n_samples>1 would just repeat the same prediction
  primary_image_mode: target_zero
  image_modes: [target_zero, all_zero]
  k_neighborhood: 8
  pca_n_components: 50
  # No fixed_gene_panel_paths here -- resources/evaluation/hest_bench/
  # LUNG_var_50genes.json is Lung-specific and this run spans many organs;
  # the full-gene-panel PCC/RMSE (organ-agnostic) is the primary
  # comparison metric for this round. Add a fixed_gene_panel_paths entry
  # back once evaluation is organ-scoped enough for a per-organ panel to
  # be meaningful.
