# Cross-model-family test (2026-07-17): does STPath's Route-B Novae-only
# residual help WAE-GAN? Companion data point to night7's plain
# wae_gan_stpath control and wae_gan_stpath_bothresidual — WAE-GAN+
# StormLite is confirmed broken (reproducible mode collapse across 2
# seeds, see exp_hest1k_wae_gan_stormlite_mome_both.yaml), so this checks
# whether WAE-GAN is fine with STPath's real pretrained fusion plus a
# SINGLE residual source (a smaller architectural change than "both"),
# and picks Novae specifically since night6's reseeded unfrozen-STPath
# results reproducibly favored Novae residual over MLP residual across 2
# seeds — worth checking if that holds for a structurally different
# generator family too.
#
# Direct comparison targets: exp_hest1k_wae_gan_stpath.yaml (plain) and
# exp_hest1k_wae_gan_stpath_bothresidual.yaml (companion, from night7).
#
# Requires `pip install novae` (Python >=3.11).

experiment_name: wae_gan_hest1k_pilot_stpath_novaeresidual

data:
  use_images: true
  source: hest1k
  hest_data_dir: data/raw/hest1k
  sample_id: INT1
  task: intra_slice
  min_genes: 200
  min_cells: 3

masking:
  strategy: random_dropout_patches
  params:
    n_patches: 3
    radius_range: [250, 450]

model:
  name: wae_gan
  params:
    context_encoder_type: stpath
    stpath_gene_voc_path: ${oc.env:STPATH_GENE_VOC_PATH}
    stpath_model_weight_path: ${oc.env:STPATH_MODEL_WEIGHT_PATH}
    stpath_organ_type: Kidney      # INT1 is ccRCC (renal cell carcinoma)
    stpath_tech_type: Visium
    stpath_new_gene_encoder_type: novae   # 2026-07-17: see header
    # stpath_novae_dim is NOT set here — auto-injected from the real
    # precomputed Novae features' shape (see train.py
    # inject_stpath_novae_dim / get_novae_features)
    # stpath_gene_names auto-derived from the loaded AnnData at load time
    # (train.py/run_comparison.py inject_stpath_gene_names) - do not set here
    n_genes: 16570                # INT1 after QC, same as exp_hest1k_wae_gan_stpath.yaml
    coord_dim: 3
    latent_dim: 32
    hidden_dim: 256
    cond_hidden_dim: 256
    disc_hidden_dim: 128
    adv_weight: 1.0
    lr: 1.0e-3
    lr_disc: 1.0e-3

training:
  epochs: 10000                  # same as exp_hest1k_wae_gan_stpath.yaml - fair comparison
  seed: 0
  log_every_n_steps: 10
  checkpoint_dir: results/checkpoints/${experiment_name}

evaluation:
  metrics: [pearson_per_gene, rmse, nonzero_auc, st_fid, st_mmd]
  embedding_for_fid: pca
  pca_n_components: 50

logging:
  backend: wandb
  project: st3d-lundeberg-lab
