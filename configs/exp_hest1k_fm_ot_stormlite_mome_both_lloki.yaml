# LLOKI-style decoder test (2026-07-17) on this project's leading
# from-scratch context encoder (StormLite+MoME). Faithfully ports
# LLOKI-CAE's real, verified mechanism (Levy et al. 2025, Genome
# Research — source verified directly: github.com/ma-compbio/LLOKI) —
# technology token concatenated at decoder input, multi-layer ReLU stack.
# NOT panel-invariant (fixed n_genes width, same limitation as "dense" —
# see LLOKIStyleDecoder's own docstring for why: LLOKI's real
# panel-invariance comes from a separate component, LLOKI-FP, not ported
# here). tech_vocab=["Visium"] since query["tech"] is auto-populated from
# adata.obs["tech"] regardless of whether organ/tech conditioning is
# enabled on the context encoder itself.
#
# Direct comparison target: exp_hest1k_fm_ot_stormlite_mome_both.yaml
# (dense decoder, PCC 0.2798 @ 10k, 0.3461 @ 40k) — does
# technology-conditioned decoding help even within a single-technology
# dataset (adapting to Visium's own detection biases), or is it a no-op
# absent real cross-platform variation?
#
# Requires `pip install novae` (Python >=3.11).

experiment_name: fm_ot_hest1k_pilot_stormlite_mome_both_lloki

data:
  use_images: true
  source: hest1k
  hest_data_dir: data/raw/hest1k
  sample_id: INT1
  task: intra_slice
  min_genes: 200
  min_cells: 3

masking:
  strategy: random_dropout_patches
  params:
    n_patches: 3
    radius_range: [250, 450]

model:
  name: fm_ot
  params:
    context_encoder_type: storm_lite
    gene_encoder_type: both
    storm_lite_fusion_mode: mome
    decoder_type: lloki             # 2026-07-17: see header
    tech_vocab: ["Visium"]          # required by LLOKIStyleDecoder
    decoder_lloki_tech_embed_dim: 10
    decoder_lloki_hidden_dims: [512, 256, 128]  # LLOKI-CAE's real published shape
    storm_lite_n_layers: 2
    storm_lite_n_heads: 4
    n_genes: 16570                # INT1 after QC, same as exp_hest1k_fm_ot_stpath.yaml
    coord_dim: 3
    cond_hidden_dim: 256           # also StormLiteContextEncoder's internal token dim
    latent_dim: 32
    ae_hidden_dim: 256
    hidden_dim: 512
    time_embed_dim: 64
    n_ode_steps: 50
    recon_weight: 1.0
    fm_weight: 1.0
    lr: 1.0e-3

training:
  epochs: 10000
  seed: 0
  log_every_n_steps: 10
  checkpoint_dir: results/checkpoints/${experiment_name}

evaluation:
  metrics: [pearson_per_gene, rmse, nonzero_auc, st_fid, st_mmd]
  embedding_for_fid: pca
  pca_n_components: 50

logging:
  backend: wandb
  project: st3d-lundeberg-lab
