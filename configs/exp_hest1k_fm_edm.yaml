# FM-OT's diffusion-path ablation (path_type: edm) on one real HEST-1k
# sample. Same registered model ("fm_ot"), same network, same pilot
# sample/masking as configs/exp_hest1k_fm_ot.yaml — only path_type and the
# EDM-specific hyperparameters differ. EDM = Karras et al. 2022, NeurIPS,
# "Elucidating the Design Space of Diffusion-Based Generative Models" -
# see src/models/registry.py FlowMatchingOT comment for full grounding and
# explicitly-flagged simplifications (Euler not Heun sampler,
# sigma_data/P_mean/P_std are EDM's own image-domain defaults, not
# retuned for our latent scale).

experiment_name: fm_edm_hest1k_pilot

data:
  source: hest1k
  hest_data_dir: data/raw/hest1k
  sample_id: INT1
  task: intra_slice
  min_genes: 200
  min_cells: 3

masking:
  strategy: random_dropout_patches
  params:
    n_patches: 3
    radius_range: [250, 450]

model:
  name: fm_ot
  params:
    n_genes: 16570                # INT1 after QC, same as other exp_hest1k_*.yaml configs
    coord_dim: 3
    cond_hidden_dim: 256
    latent_dim: 32
    ae_hidden_dim: 256
    hidden_dim: 512
    time_embed_dim: 64
    n_ode_steps: 50                # EDM sampling steps at sample time; not used during training
    recon_weight: 1.0
    fm_weight: 1.0
    lr: 1.0e-3
    path_type: edm                 # the only real difference from exp_hest1k_fm_ot.yaml
    sigma_min: 0.002               # EDM defaults (Karras et al. 2022) - not retuned for our data
    sigma_max: 80.0
    sigma_data: 0.5
    rho: 7.0
    edm_p_mean: -1.2
    edm_p_std: 1.2

training:
  epochs: 10000
  seed: 0
  log_every_n_steps: 10
  checkpoint_dir: results/checkpoints/${experiment_name}

evaluation:
  metrics: [pearson_per_gene, rmse, nonzero_auc, st_fid]
  embedding_for_fid: pca
  pca_n_components: 50

logging:
  backend: wandb
  project: st3d-lundeberg-lab
