# scGPT-grounded PanelInvariantGeneDecoder test (2026-07-17) on this
# project's overall best context encoder (pretrained STPath +
# bothresidual). Every prior panel-invariant-decoder test used StormLite
# as the context encoder — this checks whether the same
# combine_mode="add" + gene_embed_dim=256 + mlp_depth=2 configuration
# (see exp_hest1k_fm_ot_stormlite_mome_both_paneldecoder_add.yaml's own
# header for the full scGPT/Geneformer/LLOKI research writeup) works as
# well when paired with a much stronger context encoder, not just
# StormLite's from-scratch fusion.
#
# Direct comparison target: exp_hest1k_fm_ot_stpath_bothresidual.yaml
# (dense decoder, PCC 0.4154 @ 10k; STPath's own best-ever result,
# pretrained bothresidual @ 40k, was PCC 0.4717 — see docs/results_log.md).
#
# 2026-07-19: bumped 10k -> 40k to match the scale StormLite's
# panel_invariant/add win (PCC 0.4933 @ 40k) was measured at — the
# question this config actually answers ("does the SAME decoder swap that
# helped StormLite also help STPath, holding the decoder constant to
# isolate the encoder-choice question") needs an apples-to-apples epoch
# count, not the original 10k quick-check scale.
#
# Requires `pip install novae` (Python >=3.11).

experiment_name: fm_ot_hest1k_pilot_stpath_bothresidual_paneldecoder_add

data:
  use_images: true
  source: hest1k
  hest_data_dir: data/raw/hest1k
  sample_id: INT1
  task: intra_slice
  min_genes: 200
  min_cells: 3

masking:
  strategy: random_dropout_patches
  params:
    n_patches: 3
    radius_range: [250, 450]

model:
  name: fm_ot
  params:
    context_encoder_type: stpath
    stpath_gene_voc_path: ${oc.env:STPATH_GENE_VOC_PATH}
    stpath_model_weight_path: ${oc.env:STPATH_MODEL_WEIGHT_PATH}
    stpath_organ_type: Kidney      # INT1 is ccRCC (renal cell carcinoma)
    stpath_tech_type: Visium
    stpath_new_gene_encoder_type: both
    decoder_type: panel_invariant   # 2026-07-17: see header
    # decoder_gene_names is NOT set here — auto-injected from adata.var_names
    # (see train.py inject_decoder_gene_names), same panel as context/training
    decoder_gene_embed_dim: 256
    decoder_combine_mode: add       # scGPT's real combination rule
    decoder_mlp_depth: 2
    # stpath_novae_dim is NOT set here — auto-injected from the real
    # precomputed Novae features' shape (see train.py
    # inject_stpath_novae_dim / get_novae_features)
    n_genes: 16570                # INT1 after QC, same as exp_hest1k_fm_ot_stpath.yaml
    coord_dim: 3
    cond_hidden_dim: 256
    latent_dim: 32
    ae_hidden_dim: 256
    hidden_dim: 512
    time_embed_dim: 64
    n_ode_steps: 50
    recon_weight: 1.0
    fm_weight: 1.0
    lr: 1.0e-3

training:
  epochs: 40000
  seed: 0
  log_every_n_steps: 10
  checkpoint_dir: results/checkpoints/${experiment_name}
  checkpoint_every_n_steps: 10000
  log_print_every_n_steps: 1000

evaluation:
  metrics: [pearson_per_gene, rmse, nonzero_auc, st_fid, st_mmd]
  embedding_for_fid: pca
  pca_n_components: 50

logging:
  backend: wandb
  project: st3d-lundeberg-lab
