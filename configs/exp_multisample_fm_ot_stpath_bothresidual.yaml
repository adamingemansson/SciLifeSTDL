# Multi-sample run (2026-07-17), this project's overall best single-sample
# context encoder (pretrained STPath + bothresidual) — the comparison
# anchor for tonight's StormLite-focused batch. See
# exp_multisample_fm_ot_stormlite_mome_both.yaml's header for the general
# reasoning (sample_ids assumption, n_genes auto-injection).
#
# REAL CAVEAT (see load_multi_sample_data's own docstring in train.py):
# STPathContextEncoder uses ONE FIXED stpath_organ_type/stpath_tech_type
# string across every sample in sample_ids — its real pretrained
# IDTokenizer vocabulary, not a per-sample-dynamic mechanism the way
# OrganTechEmbedding is. Fine here since INT1-INT8 are all documented as
# the same ccRCC/Visium cohort (same single fixed value is correct for
# every sample) — would NOT be fine if genuinely mixed-organ/platform
# samples were ever added to sample_ids without also extending
# STPathContextEncoder itself.
#
# Direct comparison target: exp_hest1k_fm_ot_stpath_bothresidual.yaml
# (single-sample, INT1 only, PCC 0.4154 @ 10k / 0.4717 @ 40k).
#
# Requires `pip install novae` (Python >=3.11).

experiment_name: multisample_fm_ot_stpath_bothresidual

data:
  use_images: true
  source: hest1k
  hest_data_dir: data/raw/hest1k
  sample_ids: [INT1, INT2, INT3, INT4, INT5, INT6, INT7, INT8]
  task: intra_slice
  min_genes: 200
  min_cells: 3

masking:
  strategy: random_dropout_patches
  params:
    n_patches: 3
    radius_range: [250, 450]

model:
  name: fm_ot
  params:
    context_encoder_type: stpath
    stpath_gene_voc_path: ${oc.env:STPATH_GENE_VOC_PATH}
    stpath_model_weight_path: ${oc.env:STPATH_MODEL_WEIGHT_PATH}
    stpath_organ_type: Kidney      # all of INT1-INT8 are ccRCC — see header caveat
    stpath_tech_type: Visium
    stpath_new_gene_encoder_type: both
    # n_genes is NOT set — auto-injected, see companion config's header
    coord_dim: 3
    cond_hidden_dim: 256
    latent_dim: 32
    ae_hidden_dim: 256
    hidden_dim: 512
    time_embed_dim: 64
    n_ode_steps: 50
    recon_weight: 1.0
    fm_weight: 1.0
    lr: 1.0e-3

training:
  epochs: 40000   # 2026-07-17: bumped from 10000 for the overnight batch
  seed: 0
  log_every_n_steps: 10
  checkpoint_dir: results/checkpoints/${experiment_name}
  checkpoint_every_n_steps: 10000   # unsupervised overnight run — see PeriodicCheckpointCallback

evaluation:
  metrics: [pearson_per_gene, rmse, nonzero_auc, st_fid, st_mmd]
  embedding_for_fid: pca
  pca_n_components: 50

logging:
  backend: wandb
  project: st3d-lundeberg-lab
