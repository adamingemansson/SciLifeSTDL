# WAE-GAN counterpart to exp_hest1k_fm_ot_he_gigapath_mlpgene.yaml — user
# explicitly wants the GEX-encoder comparison run on both FM-OT and
# WAE-GAN (2026-07-16), not FM-OT alone.

experiment_name: wae_gan_hest1k_pilot_he_gigapath_mlpgene

data:
  use_images: true
  source: hest1k
  hest_data_dir: data/raw/hest1k
  sample_id: INT1
  task: intra_slice
  min_genes: 200
  min_cells: 3

masking:
  strategy: random_dropout_patches
  params:
    n_patches: 3
    radius_range: [250, 450]

model:
  name: wae_gan
  params:
    image_encoder_type: gigapath
    image_feat_dim: 64
    image_patch_size: 224
    gene_encoder_type: mlp         # see exp_hest1k_fm_ot_he_gigapath_mlpgene.yaml for the
                                     # full rationale/setup notes (identical here)
    gene_feat_dim: 256
    n_genes: 16570
    coord_dim: 3
    latent_dim: 32
    hidden_dim: 256
    cond_hidden_dim: 256
    disc_hidden_dim: 128
    adv_weight: 1.0
    lr: 1.0e-3
    lr_disc: 1.0e-3

training:
  epochs: 10000
  seed: 0
  log_every_n_steps: 10
  checkpoint_dir: results/checkpoints/${experiment_name}

evaluation:
  metrics: [pearson_per_gene, rmse, nonzero_auc, st_fid, st_mmd]
  embedding_for_fid: pca
  pca_n_components: 50

logging:
  backend: wandb
  project: st3d-lundeberg-lab
