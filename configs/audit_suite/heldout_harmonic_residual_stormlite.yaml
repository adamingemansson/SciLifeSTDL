experiment_name: heldout_harmonic_residual_stormlite
data:
  source: hest1k
  hest_data_dir: data/raw/hest1k
  sample_id: INT1
  task: intra_slice
  min_genes: 200
  min_cells: 3
  expression_transform: normalize_log1p
  expression_target_sum: 10000.0
  novae_mode: disabled
  require_image_coverage: true
  use_images: true
  sample_ids:
  - INT1
  - INT2
  - INT3
  - INT4
  - INT5
  - INT6
  - INT7
  - INT8
  - INT9
  - INT10
  - INT11
  - INT12
  train_sample_ids:
  - INT1
  - INT2
  - INT3
  - INT4
  - INT5
  - INT6
  - INT7
  - INT8
  validation_sample_ids:
  - INT9
  - INT10
  test_sample_ids:
  - INT11
  - INT12
  organ_by_sample:
    INT1: Kidney
    INT2: Kidney
    INT3: Kidney
    INT4: Kidney
    INT5: Kidney
    INT6: Kidney
    INT7: Kidney
    INT8: Kidney
    INT9: Kidney
    INT10: Kidney
    INT11: Kidney
    INT12: Kidney
  tech_by_sample:
    INT1: Visium
    INT2: Visium
    INT3: Visium
    INT4: Visium
    INT5: Visium
    INT6: Visium
    INT7: Visium
    INT8: Visium
    INT9: Visium
    INT10: Visium
    INT11: Visium
    INT12: Visium
masking:
  strategy: random_dropout_patches
  max_context_points: 768
  params:
    n_patches: 3
    radius_range:
    - 250
    - 450
model:
  name: harmonic_residual
  params:
    coord_dim: 3
    cond_hidden_dim: 256
    hidden_dim: 512
    harmonic_k: 8
    harmonic_ridge: 0.0001
    lr: 0.001
    context_encoder_type: storm_lite
    gene_encoder_type: mlp
    storm_lite_fusion_mode: mome
    storm_lite_qk_norm: true
    use_organ_tech_conditioning: true
training:
  epochs: 60000
  seed: 0
  log_every_n_steps: 10
  log_print_every_n_steps: 250
  checkpoint_every_n_steps: 5000
  num_workers: 0
  augment_coords: true
  image_mode: full
  query_image_dropout_p: 0.35
  all_image_dropout_p: 0.1
  gradient_clip_val: 1.0
  checkpoint_dir: results/checkpoints/audit_suite/heldout_harmonic_residual_stormlite
validation:
  enabled: true
  every_n_steps: 1000
  patience_checks: 6
  min_delta: 0.0001
  metric: rmse
  n_samples: 4
  sampling_seed: 800000
evaluation:
  n_validation_masks: 4
  n_test_masks: 8
  validation_seed: 700000
  test_seed: 900000
  sampling_seed: 1200000
  n_samples: 20
  image_modes:
  - full
  - target_zero
  - all_zero
  - shuffled
  validation_image_mode: full
  k_neighborhood: 8
  pca_n_components: 50
  mask_bank_dir: results/mask_banks/heldout
logging:
  backend: csv
  project: st3d-lundeberg-lab
