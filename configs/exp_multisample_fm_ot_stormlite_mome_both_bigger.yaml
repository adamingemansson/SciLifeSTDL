# Flagship overnight config (2026-07-17): combines the two real levers
# tonight's batch is testing independently — bigger capacity
# (exp_hest1k_fm_ot_stormlite_mome_both_bigger.yaml) and multi-sample data
# diversity (exp_multisample_fm_ot_stormlite_mome_both.yaml) — into one
# run. This is the actual best shot at making StormLite beat STPath
# tonight: if capacity alone doesn't close the gap, and data diversity
# alone doesn't either, combining both might, since they're addressing
# different hypotheses (architecture bottleneck vs. single-sample
# overfitting) that could be additive.
#
# sample_ids below assumes INT1-INT8 are downloaded locally — check with
# `ls data/raw/hest1k/` first and trim this list to match what's actually
# present; a missing sample raises a clear FileNotFoundError naming it
# (loaders.load_hest_sample), not a silent skip.
#
# n_genes is NOT set — auto-injected from the real shared-gene-panel
# intersection (inject_multi_sample_n_genes).
#
# Direct comparison targets: exp_hest1k_fm_ot_stormlite_mome_both.yaml
# (baseline, single-sample, default capacity, PCC 0.3461 @ 40k),
# exp_hest1k_fm_ot_stormlite_mome_both_bigger.yaml (capacity alone),
# exp_multisample_fm_ot_stormlite_mome_both.yaml (data diversity alone).
#
# Requires `pip install novae` (Python >=3.11).

experiment_name: multisample_fm_ot_stormlite_mome_both_bigger

data:
  use_images: true
  source: hest1k
  hest_data_dir: data/raw/hest1k
  sample_ids: [INT1, INT2, INT3, INT4, INT5, INT6, INT7, INT8]
  task: intra_slice
  min_genes: 200
  min_cells: 3

masking:
  strategy: random_dropout_patches
  params:
    n_patches: 3
    radius_range: [250, 450]

model:
  name: fm_ot
  params:
    context_encoder_type: storm_lite
    gene_encoder_type: both
    storm_lite_fusion_mode: mome
    # n_genes is NOT set — see header
    storm_lite_n_layers: 4          # 2026-07-17: bumped from 2, see header
    storm_lite_n_heads: 8           # 2026-07-17: bumped from 4, see header
    coord_dim: 3
    cond_hidden_dim: 512           # 2026-07-17: bumped from 256, see header
    latent_dim: 32
    ae_hidden_dim: 256
    hidden_dim: 512
    time_embed_dim: 64
    n_ode_steps: 50
    recon_weight: 1.0
    fm_weight: 1.0
    lr: 1.0e-3

training:
  epochs: 40000
  seed: 0
  log_every_n_steps: 10
  checkpoint_dir: results/checkpoints/${experiment_name}
  checkpoint_every_n_steps: 10000   # unsupervised overnight run — see PeriodicCheckpointCallback

evaluation:
  metrics: [pearson_per_gene, rmse, nonzero_auc, st_fid, st_mmd]
  embedding_for_fid: pca
  pca_n_components: 50

logging:
  backend: wandb
  project: st3d-lundeberg-lab
