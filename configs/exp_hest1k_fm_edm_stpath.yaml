# EDM path_type + STPath variant of configs/exp_hest1k_fm_ot.yaml — task #18.
# Combines two ablations that were previously separate:
# exp_hest1k_fm_edm.yaml (diffusion path, expression-only) and
# exp_hest1k_fm_ot_stpath.yaml (OT path, STPath pretrained H&E+expression
# encoder) — added 2026-07-15 so EDM is tested identically to
# WAE-GAN/FM-OT-ot/VQ-VAE+AR across all four encoder choices, not left as
# a single expression-only row. Replaces the ENTIRE context_encoder with
# STPathContextEncoder, not just an image branch fused into our own
# encoder (compare to the *_he_cnn.yaml / *_he_gigapath.yaml variants,
# task #17/#20). See src/models/registry.py FlowMatchingOT for the EDM
# implementation (Karras et al. 2022) and its explicitly-flagged
# simplifications (Euler not Heun sampler, sigma_data/P_mean/P_std are
# EDM's own image-domain defaults, not retuned for our latent scale).
#
# EDIT the two stpath_*_path fields below before running — see
# src/models/stpath_encoder.py for what they need to point at (already
# filled in for the OT-path sibling configs' real values on this machine
# — copy from exp_hest1k_fm_ot_stpath.yaml if those still apply).

experiment_name: fm_edm_hest1k_pilot_stpath

data:
  use_images: true               # task #18: STPath needs H&E patches too
  source: hest1k
  hest_data_dir: data/raw/hest1k
  sample_id: INT1
  task: intra_slice
  min_genes: 200
  min_cells: 3

masking:
  strategy: random_dropout_patches
  params:
    n_patches: 3
    radius_range: [250, 450]

model:
  name: fm_ot
  params:
    context_encoder_type: stpath   # task #18: replaces the whole context_encoder
                                    # with STPathContextEncoder - see
                                    # src/models/stpath_encoder.py for setup
                                    # (clone STPath, pip install -e ., download
                                    # weights, locate symbol2ensembl.json)
    stpath_gene_voc_path: /Users/adamingemansson/SciLifeSTDL/STPath/utils_data/symbol2ensembl.json
    stpath_model_weight_path: /Users/adamingemansson/SciLifeSTDL/STPath_weights/stfm.pth
    stpath_organ_type: Kidney      # INT1 is ccRCC (renal cell carcinoma)
    stpath_tech_type: Visium
    # stpath_gene_names auto-derived from the loaded AnnData at load time
    # (train.py/run_comparison.py inject_stpath_gene_names) - do not set here
    n_genes: 16570                # INT1 after QC, same as exp_hest1k_wae_gan.yaml
    coord_dim: 3
    cond_hidden_dim: 256
    latent_dim: 32                 # flow matching runs in this latent space, not raw
                                    # 16570-gene space - see registry.py FM-OT comment
                                    # (2026-07-14: raw-space runs were stuck at PCC~0,
                                    # RMSE~noise-scale from 100 to 10000 epochs)
    ae_hidden_dim: 256
    hidden_dim: 512
    time_embed_dim: 64
    n_ode_steps: 50                # EDM sampling steps at sample time; not used during training
    recon_weight: 1.0
    fm_weight: 1.0
    lr: 1.0e-3
    path_type: edm                 # the only real difference from exp_hest1k_fm_ot_stpath.yaml
    sigma_min: 0.002               # EDM defaults (Karras et al. 2022) - not retuned for our data
    sigma_max: 80.0
    sigma_data: 0.5
    rho: 7.0
    edm_p_mean: -1.2
    edm_p_std: 1.2

training:
  epochs: 10000
  seed: 0
  log_every_n_steps: 10
  checkpoint_dir: results/checkpoints/${experiment_name}

evaluation:
  metrics: [pearson_per_gene, rmse, nonzero_auc, st_fid]
  embedding_for_fid: pca
  pca_n_components: 50

logging:
  backend: wandb
  project: st3d-lundeberg-lab
