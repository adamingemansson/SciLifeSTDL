# STORM-lite fusion transformer (2026-07-16) — see
# exp_hest1k_fm_ot_stormlite_mlp.yaml for the full header/reasoning
# (identical here). This variant uses CombinedGeneEncoder (MLP+Novae
# summed) on the gene side — the most direct answer to "MLP+Novae+
# GigaPath+fusion transformer" (2026-07-16 discussion).
#
# Requires `pip install novae` (Python >=3.11) — see
# src/models/conditioning.py precompute_novae_features docstring.

experiment_name: fm_ot_hest1k_pilot_stormlite_both

data:
  use_images: true
  source: hest1k
  hest_data_dir: data/raw/hest1k
  sample_id: INT1
  task: intra_slice
  min_genes: 200
  min_cells: 3

masking:
  strategy: random_dropout_patches
  params:
    n_patches: 3
    radius_range: [250, 450]

model:
  name: fm_ot
  params:
    context_encoder_type: storm_lite
    gene_encoder_type: both         # 2026-07-16: CombinedGeneEncoder (MLP+Novae summed)
    # novae_dim is NOT set here — auto-injected from the real precomputed
    # Novae features' shape (see train.py inject_novae_dim / get_novae_features)
    storm_lite_n_layers: 2
    storm_lite_n_heads: 4
    n_genes: 16570                # INT1 after QC, same as exp_hest1k_fm_ot_stpath.yaml
    coord_dim: 3
    cond_hidden_dim: 256           # also StormLiteContextEncoder's internal token dim
    latent_dim: 32
    ae_hidden_dim: 256
    hidden_dim: 512
    time_embed_dim: 64
    n_ode_steps: 50
    recon_weight: 1.0
    fm_weight: 1.0
    lr: 1.0e-3

training:
  epochs: 10000                  # same as exp_hest1k_fm_ot_stpath.yaml - fair comparison
  seed: 0
  log_every_n_steps: 10
  checkpoint_dir: results/checkpoints/${experiment_name}

evaluation:
  metrics: [pearson_per_gene, rmse, nonzero_auc, st_fid, st_mmd]
  embedding_for_fid: pca
  pca_n_components: 50

logging:
  backend: wandb
  project: st3d-lundeberg-lab
