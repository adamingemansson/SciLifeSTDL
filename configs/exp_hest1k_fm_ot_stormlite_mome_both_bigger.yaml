# Capacity scale-up (2026-07-17) — StormLite's flagship arm (mome_both)
# now trails STPath's from-scratch (unfrozen) architecture even without
# any pretraining advantage: unfrozen bothresidual hit PCC 0.3857 @ 40k,
# beating StormLite mome_both's 0.3461 @ 40k. Since neither has pretrained
# weights at this comparison point, the gap is architectural, not about
# pretraining — this tests whether StormLite's much smaller capacity
# (2 transformer layers, 4 heads, 256-dim tokens) is the actual
# bottleneck, by scaling all three up to something closer to what STPath's
# real spatial transformer runs at.
#
# Direct comparison target: exp_hest1k_fm_ot_stormlite_mome_both.yaml
# (identical everything else — n_layers=2, n_heads=4, cond_hidden_dim=256).
#
# checkpoint_every_n_steps: this is a long (40k-epoch) unsupervised
# overnight run — periodically overwrites the saved checkpoint every 10k
# steps (PeriodicCheckpointCallback, train.py) so a killed/crashed run
# still leaves a recent, loadable checkpoint behind.
#
# Requires `pip install novae` (Python >=3.11).

experiment_name: fm_ot_hest1k_pilot_stormlite_mome_both_bigger

data:
  use_images: true
  source: hest1k
  hest_data_dir: data/raw/hest1k
  sample_id: INT1
  task: intra_slice
  min_genes: 200
  min_cells: 3

masking:
  strategy: random_dropout_patches
  params:
    n_patches: 3
    radius_range: [250, 450]

model:
  name: fm_ot
  params:
    context_encoder_type: storm_lite
    gene_encoder_type: both
    storm_lite_fusion_mode: mome
    # novae_dim is NOT set here — auto-injected from the real precomputed
    # Novae features' shape (see train.py inject_novae_dim / get_novae_features)
    storm_lite_n_layers: 4          # 2026-07-17: bumped from 2 — see header
    storm_lite_n_heads: 8           # 2026-07-17: bumped from 4 — see header
    n_genes: 16570                # INT1 after QC, same as exp_hest1k_fm_ot_stpath.yaml
    coord_dim: 3
    cond_hidden_dim: 512           # 2026-07-17: bumped from 256 — also StormLiteContextEncoder's internal token dim
    latent_dim: 32
    ae_hidden_dim: 256
    hidden_dim: 512
    time_embed_dim: 64
    n_ode_steps: 50
    recon_weight: 1.0
    fm_weight: 1.0
    lr: 1.0e-3

training:
  epochs: 40000
  seed: 0
  log_every_n_steps: 10
  checkpoint_dir: results/checkpoints/${experiment_name}
  checkpoint_every_n_steps: 10000
  log_print_every_n_steps: 1000   # 2026-07-19: real loss telemetry — see PeriodicPrintCallback,
                                   # this is the config that collapsed to PCC=nan overnight

evaluation:
  metrics: [pearson_per_gene, rmse, nonzero_auc, st_fid, st_mmd]
  embedding_for_fid: pca
  pca_n_components: 50

logging:
  backend: wandb
  project: st3d-lundeberg-lab
