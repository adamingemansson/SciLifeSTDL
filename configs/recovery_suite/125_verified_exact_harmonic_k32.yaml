# Verified exact-sample control: pure harmonic k=32 on unseen INT8.
experiment_name: missing_tissue_verified_exact_harmonic_k32
data:
  source: hest1k
  hest_data_dir: data/raw/hest1k
  hest_cache_dir: data/cache/hest1k
  sample_id: INT1
  sample_ids: [INT1, INT2, INT3, INT4, INT5, INT6, INT7, INT8]
  train_sample_ids: [INT1, INT2, INT3, INT4, INT5, INT6]
  validation_sample_ids: [INT7]
  test_sample_ids: [INT8]
  holdout_unit: sample
  task: intra_slice
  task_contract: missing_tissue
  modality_ablation: gex_only
  min_genes: 200
  min_cells: 3
  expression_transform: normalize_log1p
  expression_target_sum: 10000.0
  novae_mode: disabled
  require_image_coverage: true
  use_images: false
  organ_by_sample:
    INT1: Kidney
    INT2: Kidney
    INT3: Kidney
    INT4: Kidney
    INT5: Kidney
    INT6: Kidney
    INT7: Kidney
    INT8: Kidney
  tech_by_sample:
    INT1: Visium
    INT2: Visium
    INT3: Visium
    INT4: Visium
    INT5: Visium
    INT6: Visium
    INT7: Visium
    INT8: Visium
masking:
  strategy: random_dropout_patches
  max_context_points: 768
  params:
    n_patches: 3
    radius_range: [250, 450]
model:
  name: spatial_baseline
  params:
    mode: harmonic
    k: 32
    ridge: 0.0001
training:
  epochs: 1
  seed: 10
  mask_seed: 700000
  unique_mask_count: 1
  log_every_n_steps: 10
  num_workers: 0
  augment_coords: false
  image_mode: all_zero
  query_image_dropout_p: 0.0
  all_image_dropout_p: 0.0
  context_gex_mode: full
  context_gex_dropout_p: 0.0
  checkpoint_dir: results/checkpoints/recovery_suite/missing_tissue_verified_exact_harmonic_k32
validation:
  enabled: false
evaluation:
  mask_bank_dir: results/mask_banks/recovery_suite/verified_exact_folda
  n_validation_masks: 4
  n_test_masks: 8
  validation_seed: 710000
  test_seed: 910000
  sampling_seed: 1210000
  n_samples: 1
  primary_image_mode: all_zero
  image_modes: [all_zero]
  validation_image_mode: all_zero
  context_gex_mode: full
  k_neighborhood: 8
  pca_n_components: 50
  training_mask_bank_path: results/mask_banks/training/recovery_suite/verified_exact_anchor_1_seed700000.json
logging:
  backend: csv
  project: st3d-lundeberg-lab
