# Round-4 candidate-mechanism x hole-size ablation (2026-07-23): 209 (smallhole C05, radius_range [0.5,1.0]) with use_retrieval_candidate=true (see 222). Tests whether content retrieval matters more when local physical context is sparsest -- the same reasoning behind 216 (global candidate + smallhole). 10k steps. Shares 209/210's evaluation masks (smallhole).
experiment_name: transport_c05_retrieval_smallhole_v2_10k
data:
  source: hest1k
  hest_data_dir: data/raw/hest1k
  hest_cache_dir: data/cache/hest1k
  slide_context_source: dense_wsi_cache
  slide_context_cache_dir: data/cache/hest1k/gigapath_slide_cache
  strict_broken_region: true
  query_patch_size_fullres: 224.0
  sample_ids: [INT1, INT2, INT3, INT4, INT5, INT6, INT7, INT8]
  train_sample_ids: [INT1, INT2, INT3, INT4, INT5, INT6]
  validation_sample_ids: [INT7]
  test_sample_ids: [INT8]
  holdout_unit: sample
  task: intra_slice
  task_contract: missing_tissue
  modality_ablation: both
  min_genes: 200
  min_cells: 3
  expression_transform: normalize_log1p
  expression_target_sum: 10000.0
  novae_mode: context_only
  require_image_coverage: true
  use_images: true
  organ_by_sample: {INT1: Kidney, INT2: Kidney, INT3: Kidney, INT4: Kidney, INT5: Kidney, INT6: Kidney, INT7: Kidney, INT8: Kidney}
  tech_by_sample: {INT1: Visium, INT2: Visium, INT3: Visium, INT4: Visium, INT5: Visium, INT6: Visium, INT7: Visium, INT8: Visium}
masking:
  strategy: random_dropout_patches
  max_context_points: 3000
  context_selection: nearest_query
  params:
    n_patches: 1
    radius_range: [0.5, 1.0]
    radius_unit: spot_spacing
    shape: mixed
model:
  name: hierarchical_gene_transport_regressor
  params:
    hidden_dim: 256
    n_heads: 4
    context_layers: 2
    cross_layers: 2
    query_layers: 1
    local_k: 128
    dropout: 0.1
    use_novae: true
    use_local_images: true
    use_slide_context: true
    gene_encoder_type: weighted_linear
    fusion_mode: concat
    slide_checkpoint_path: ${oc.env:GIGAPATH_SLIDE_CHECKPOINT}
    slide_output_dim: 768
    score_hidden_dim: 128
    transport_heads: 8
    transport_temperature: 1.0
    idw_power: 2.0
    conditioning_mode: hierarchical
    gene_gate_mode: per_gene
    use_retrieval_candidate: true
    retrieval_k: 8
    retrieval_dim: 64
    retrieval_temperature: 0.1
    retrieval_loss_weight: 0.1
    use_query_gate: true
    use_query_gene_gate: false
    use_residual: false
    residual_rank: 32
    correlation_loss_weight: 0.25
    transport_reg_weight: 0.0
    residual_penalty_weight: 0.001
    target_scale_floor: 0.05
    lr: 0.001
    conditioner_lr: 0.0003
    weight_decay: 0.01
training:
  epochs: 10000
  seed: 10
  mask_seed: 760000
  unique_mask_count: 256
  log_every_n_steps: 10
  log_print_every_n_steps: 500
  checkpoint_every_n_steps: 5000
  num_workers: 0
  augment_coords: false
  image_mode: target_zero
  context_gex_mode: full
  query_image_dropout_p: 0.0
  all_image_dropout_p: 0.0
  context_gex_dropout_p: 0.0
  gradient_clip_val: 1.0
  checkpoint_dir: results/checkpoints/recovery_suite/transport_c05_retrieval_smallhole_v2_10k
validation:
  enabled: true
  every_n_steps: 1000
  patience_checks: 1000
  early_stopping_min_steps: 10000
  require_anchor_improvement: false
  min_delta: 0.0001
  metric: rmse
  n_samples: 1
  sampling_seed: 860000
evaluation:
  mask_bank_dir: results/mask_banks/recovery_suite/transport_c05_all_modalities_concat_k128_v2_20k_smallhole
  n_validation_masks: 8
  n_test_masks: 16
  validation_seed: 760000
  test_seed: 960000
  sampling_seed: 1260000
  n_samples: 1
  primary_image_mode: target_zero
  image_modes: [target_zero, all_zero]
  validation_image_mode: target_zero
  context_gex_mode: full
  k_neighborhood: 8
  pca_n_components: 50
  fixed_gene_panel_paths: {stpath_hest_bench_ccrcc_50: resources/evaluation/hest_bench/CCRCC_var_50genes.json}
  train_variance_gene_panel_sizes: [50, 100, 250]
  training_mask_bank_path: results/mask_banks/training/recovery_suite/transport_c05_retrieval_smallhole_v2_10k_256_seed760000.json
logging:
  backend: csv
  project: st3d-lundeberg-lab
