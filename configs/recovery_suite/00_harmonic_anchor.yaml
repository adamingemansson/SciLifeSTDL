experiment_name: recovery_harmonic_anchor
data:
  source: hest1k
  hest_data_dir: data/raw/hest1k
  sample_id: INT1
  task: intra_slice
  min_genes: 200
  min_cells: 3
  expression_transform: normalize_log1p
  expression_target_sum: 10000.0
  novae_mode: disabled
  require_image_coverage: true
  use_images: false
masking:
  strategy: random_dropout_patches
  max_context_points: 768
  params:
    n_patches: 3
    radius_range: [250, 450]
model:
  name: spatial_baseline
  params:
    mode: harmonic
    k: 8
    ridge: 0.0001
training:
  epochs: 1
  seed: 0
  mask_seed: 700000
  log_every_n_steps: 10
  num_workers: 0
  augment_coords: true
  checkpoint_dir: results/checkpoints/recovery_suite/recovery_harmonic_anchor
validation:
  enabled: false
evaluation:
  mask_bank_path: results/mask_banks/recovery_suite/INT1_recovery.json
  n_validation_masks: 4
  n_test_masks: 8
  validation_seed: 700000
  test_seed: 900000
  sampling_seed: 1200000
  n_samples: 1
  image_modes: [full]
  validation_image_mode: full
  k_neighborhood: 8
  pca_n_components: 50
logging:
  backend: csv
  project: st3d-lundeberg-lab

