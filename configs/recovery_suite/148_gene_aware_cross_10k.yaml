# Gene-aware transport: INT1-6 train, INT7 validation, INT8 untouched test.
experiment_name: gene_aware_cross_base
data:
  source: hest1k
  hest_data_dir: data/raw/hest1k
  hest_cache_dir: data/cache/hest1k
  sample_id: INT1
  sample_ids: [INT1, INT2, INT3, INT4, INT5, INT6, INT7, INT8]
  train_sample_ids: [INT1, INT2, INT3, INT4, INT5, INT6]
  validation_sample_ids: [INT7]
  test_sample_ids: [INT8]
  holdout_unit: sample
  task: intra_slice
  task_contract: missing_tissue
  modality_ablation: both
  min_genes: 200
  min_cells: 3
  expression_transform: normalize_log1p
  expression_target_sum: 10000.0
  novae_mode: context_only
  require_image_coverage: true
  use_images: true
  organ_by_sample: {INT1: Kidney, INT2: Kidney, INT3: Kidney, INT4: Kidney, INT5: Kidney, INT6: Kidney, INT7: Kidney, INT8: Kidney}
  tech_by_sample: {INT1: Visium, INT2: Visium, INT3: Visium, INT4: Visium, INT5: Visium, INT6: Visium, INT7: Visium, INT8: Visium}
masking:
  strategy: random_dropout_patches
  max_context_points: 1024
  context_selection: nearest_query
  params: {n_patches: 1, radius_range: [3.0, 6.0], radius_unit: spot_spacing, shape: mixed}
model:
  name: gene_aware_transport_regressor
  params:
    coord_dim: 3
    conditioning_mode: storm_lite
    context_encoder_type: storm_lite
    gene_encoder_type: both
    cond_hidden_dim: 256
    score_hidden_dim: 128
    transport_k: 64
    transport_heads: 8
    transport_temperature: 1.0
    correlation_loss_weight: 0.25
    absolute_loss_weight: 0.0
    storm_lite_fusion_mode: mome
    storm_lite_n_layers: 2
    storm_lite_n_heads: 4
    storm_lite_knn_k: 32
    storm_lite_bias_type: frame_averaging
    storm_lite_qk_norm: true
    storm_lite_use_absolute_coords: false
    storm_lite_input_already_log1p: true
    target_scale_floor: 0.05
    lr: 0.001
    conditioner_lr: 0.0003
training:
  epochs: 10000
  seed: 10
  mask_seed: 750000
  unique_mask_count: 256
  log_every_n_steps: 10
  log_print_every_n_steps: 500
  checkpoint_every_n_steps: 5000
  num_workers: 0
  augment_coords: false
  image_mode: target_zero
  query_image_dropout_p: 0.0
  all_image_dropout_p: 0.0
  context_gex_mode: full
  context_gex_dropout_p: 0.0
  gradient_clip_val: 1.0
  checkpoint_dir: results/checkpoints/recovery_suite/gene_aware_cross_base
validation:
  enabled: true
  mask_source: evaluation
  every_n_steps: 500
  patience_checks: 1000
  early_stopping_min_steps: 10000
  require_anchor_improvement: false
  anchor_min_delta: 0.001
  min_correction_rms: 0.005
  min_delta: 0.0001
  metric: rmse
  n_samples: 1
  sampling_seed: 850000
evaluation:
  enabled: true
  mask_bank_dir: results/mask_banks/recovery_suite/simple_local_v1
  n_validation_masks: 8
  n_test_masks: 16
  validation_seed: 740000
  test_seed: 940000
  sampling_seed: 1250000
  n_samples: 1
  primary_image_mode: target_zero
  image_modes: [target_zero, all_zero]
  validation_image_mode: target_zero
  context_gex_mode: full
  k_neighborhood: 8
  pca_n_components: 50
  training_mask_bank_path: results/mask_banks/training/recovery_suite/gene_aware_cross_10k_256_seed750000.json
logging: {backend: csv, project: st3d-lundeberg-lab}
