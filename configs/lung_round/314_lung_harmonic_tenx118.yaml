# Lung round DIAGNOSTIC (2026-07-24): isolates SAMPLE-choice effect.
# Same model/masking as 304_lung_harmonic.yaml (radius_range [5.0,8.0]
# spot_spacing, mixed shape, uniformly-random placement -- UNCHANGED, not
# center_mode: geometric_median) but on TENX118, the exact sample the
# reference STPath benchmark notebook used, instead of our own MEND85.
# Single-sample format (data.sample_id, not sample_ids) since TENX118
# isn't part of our 8-sample Lung holdout split -- see
# _validated_sample_groups in src/training/train.py, which is only
# enforced when data.sample_ids (plural) is set. Requires TENX118 present
# under data/raw/hest1k/st/TENX118.h5ad + patches/TENX118.h5; if it's not
# part of your local HEST-1k mirror, download it the same way
# docs/dataset_notes.md documents for the other samples, or skip this
# config (the launcher does this automatically).
#
# If harmonic's PCC here is close to 304's holefix result (~0.008,
# same masking/placement, only the sample differs), that rules out
# TENX118 being an intrinsically "easier" slide and points the remaining
# gap back at hole placement (312/313) or something else entirely. If
# it's dramatically higher, sample choice is a real contributor too.
experiment_name: transport_lung_harmonic_tenx118_v1_holefix
data:
  source: hest1k
  hest_data_dir: data/raw/hest1k
  hest_cache_dir: data/cache/hest1k
  sample_id: TENX118
  task: intra_slice
  task_contract: missing_tissue
  modality_ablation: both
  strict_broken_region: true
  query_patch_size_fullres: 224.0
  min_genes: 200
  min_cells: 3
  expression_transform: normalize_log1p
  expression_target_sum: 10000.0
  novae_mode: context_only
  require_image_coverage: true
  use_images: true
masking:
  strategy: random_dropout_patches
  max_context_points: 3000
  context_selection: nearest_query
  params:
    n_patches: 1
    radius_range: [5.0, 8.0]
    radius_unit: spot_spacing
    shape: mixed
model:
  name: spatial_baseline
  params:
    mode: harmonic
    k: 128
    ridge: 0.0001
training:
  epochs: 1
  seed: 10
  mask_seed: 782000
  unique_mask_count: 1
  log_every_n_steps: 10
  log_print_every_n_steps: 500
  checkpoint_every_n_steps: 5000
  num_workers: 0
  augment_coords: false
  image_mode: target_zero
  context_gex_mode: full
  query_image_dropout_p: 0.0
  all_image_dropout_p: 0.0
  context_gex_dropout_p: 0.0
  gradient_clip_val: 1.0
  checkpoint_dir: results/checkpoints/lung_round/transport_lung_harmonic_tenx118_v1_holefix
validation:
  enabled: false
evaluation:
  mask_bank_path: results/mask_banks/lung_round/tenx118_v1_10k.json
  n_validation_masks: 8
  n_test_masks: 16
  validation_seed: 761000
  test_seed: 961000
  sampling_seed: 1261000
  n_samples: 1
  primary_image_mode: target_zero
  image_modes: [target_zero]
  validation_image_mode: target_zero
  context_gex_mode: full
  k_neighborhood: 8
  pca_n_components: 50
  fixed_gene_panel_paths: {lung_hest_bench_50: resources/evaluation/hest_bench/LUNG_var_50genes.json}
  train_variance_gene_panel_sizes: [50, 200]
logging:
  backend: csv
  project: st3d-lundeberg-lab
