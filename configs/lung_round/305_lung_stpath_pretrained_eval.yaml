# Lung round (2026-07-24): released, frozen STPath weights (stpath_official,
# same as the notebook's "STPath zero-shot/in-context, out of box" -- no
# training, no GPU-training slot needed, evaluation only). Reproduces the
# notebook's real image-masking collapse (zero-vector missing_image_token,
# see that class's docstring) inside this repo's own eval harness instead
# of a standalone Jupyter notebook, so it's directly comparable to the 3
# trained conditions on the same Lung samples/masks/metrics.
#
# evaluation.image_modes includes "full" (query H&E genuinely observed)
# as a DIAGNOSTIC-ONLY third entry, added after the first run scored a
# surprisingly negative PCC (-0.20) versus the notebook's much stronger
# in-context results (0.44-0.65 with observed image, still positive
# 0.13-0.21 even at masked_zero) -- "full" is NOT a valid primary/
# training mode for this task_contract (missing_tissue always withholds
# query H&E by definition, enforced by train.py's own consistency check),
# so primary_image_mode stays target_zero for the real cross-model
# comparison. "full" here only tells us whether the zero-fill specifically
# (vs. general out-of-distribution transfer to unfamiliar Lung tissue
# never seen in STPath's own pretraining) is what's driving the gap.
experiment_name: transport_lung_stpath_pretrained_eval_v1_holefix
data:
  source: hest1k
  hest_data_dir: data/raw/hest1k
  hest_cache_dir: data/cache/hest1k
  slide_context_source: disabled
  strict_broken_region: true
  query_patch_size_fullres: 224.0
  sample_ids: [TENX72, TENX62, MEND90, MEND89, MEND88, MEND87, MEND86, MEND85]
  train_sample_ids: [TENX72, TENX62, MEND90, MEND89, MEND88, MEND87]
  validation_sample_ids: [MEND86]
  test_sample_ids: [MEND85]
  holdout_unit: sample
  task: intra_slice
  task_contract: missing_tissue
  modality_ablation: both
  min_genes: 200
  min_cells: 3
  expression_transform: normalize_log1p
  expression_target_sum: 10000.0
  novae_mode: context_only
  require_image_coverage: true
  use_images: true
  organ_by_sample: {TENX72: Lung, TENX62: Lung, MEND90: Lung, MEND89: Lung, MEND88: Lung, MEND87: Lung, MEND86: Lung, MEND85: Lung}
  tech_by_sample: {TENX72: Visium, TENX62: Visium, MEND90: Visium, MEND89: Visium, MEND88: Visium, MEND87: Visium, MEND86: Visium, MEND85: Visium}
masking:
  strategy: random_dropout_patches
  max_context_points: 3000
  context_selection: nearest_query
  params:
    n_patches: 1
    radius_range: [5.0, 8.0]
    radius_unit: spot_spacing
    shape: mixed
model:
  name: stpath_official
  params:
    stpath_gene_voc_path: ${oc.env:STPATH_GENE_VOC_PATH}
    stpath_model_weight_path: ${oc.env:STPATH_MODEL_WEIGHT_PATH}
    stpath_organ_type: Lung
    stpath_tech_type: Visium
    context_encoder_type: stpath
training:
  epochs: 1
  seed: 10
  mask_seed: 765000
  unique_mask_count: 1
  log_every_n_steps: 10
  log_print_every_n_steps: 500
  checkpoint_every_n_steps: 5000
  num_workers: 0
  augment_coords: false
  image_mode: target_zero
  context_gex_mode: full
  query_image_dropout_p: 0.0
  all_image_dropout_p: 0.0
  context_gex_dropout_p: 0.0
  gradient_clip_val: 1.0
  checkpoint_dir: results/checkpoints/lung_round/transport_lung_stpath_pretrained_eval_v1_holefix
validation:
  enabled: false
evaluation:
  mask_bank_dir: results/mask_banks/lung_round/transport_lung_v2_10k_holefix
  n_validation_masks: 8
  n_test_masks: 16
  validation_seed: 761000
  test_seed: 961000
  sampling_seed: 1261000
  n_samples: 1
  primary_image_mode: target_zero
  image_modes: [target_zero, all_zero, full]
  validation_image_mode: target_zero
  context_gex_mode: full
  k_neighborhood: 8
  pca_n_components: 50
  fixed_gene_panel_paths: {lung_hest_bench_50: resources/evaluation/hest_bench/LUNG_var_50genes.json}
  train_variance_gene_panel_sizes: [50, 200]
logging:
  backend: csv
  project: st3d-lundeberg-lab
