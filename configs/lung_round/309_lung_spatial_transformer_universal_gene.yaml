# Lung round (2026-07-24): 2x2 gene-encoder x architecture design.
# Identical to 306_lung_simple_stpath_transformer.yaml (STPath's real
# SpatialTransformer backbone, dense decoder head, no organ/tech) except
# gene_encoder_type: universal_mlp -- our own MLP+LayerNorm+GELU encoder,
# but fed STPath's real fixed gene-ID vocabulary space (via
# UniversalMLPGeneEncoder, see simple_fusion_encoder.py) instead of this
# dataset's local ad-hoc gene panel. Compare against 306 to isolate:
# does a cross-dataset-stable gene identity space help, holding encoder
# depth/architecture fixed. The 2x2 with 306/307/308:
#   306 local_mlp   x spatial_transformer   307 local_mlp   x cross_attn
#   309 universal_mlp x spatial_transformer  308 universal_mlp x cross_attn
# Run all 4 together (GPUs 1,2,3,5) via run_lung_round_gene_encoder_2x2.sh.
experiment_name: transport_lung_spatial_transformer_universal_gene_v1_10k
data:
  source: hest1k
  hest_data_dir: data/raw/hest1k
  hest_cache_dir: data/cache/hest1k
  slide_context_source: disabled
  strict_broken_region: true
  query_patch_size_fullres: 224.0
  sample_ids: [TENX72, TENX62, MEND90, MEND89, MEND88, MEND87, MEND86, MEND85]
  train_sample_ids: [TENX72, TENX62, MEND90, MEND89, MEND88, MEND87]
  validation_sample_ids: [MEND86]
  test_sample_ids: [MEND85]
  holdout_unit: sample
  task: intra_slice
  task_contract: missing_tissue
  modality_ablation: both
  min_genes: 200
  min_cells: 3
  expression_transform: normalize_log1p
  expression_target_sum: 10000.0
  novae_mode: context_only
  require_image_coverage: true
  use_images: true
  organ_by_sample: {TENX72: Lung, TENX62: Lung, MEND90: Lung, MEND89: Lung, MEND88: Lung, MEND87: Lung, MEND86: Lung, MEND85: Lung}
  tech_by_sample: {TENX72: Visium, TENX62: Visium, MEND90: Visium, MEND89: Visium, MEND88: Visium, MEND87: Visium, MEND86: Visium, MEND85: Visium}
masking:
  strategy: random_dropout_patches
  max_context_points: 3000
  context_selection: nearest_query
  params:
    n_patches: 1
    radius_range: [0.5, 1.0]
    radius_unit: spot_spacing
    shape: mixed
model:
  name: stpath_backbone_simple_gene
  params:
    hidden_dim: 512
    n_layers: 4
    n_heads: 4
    dropout: 0.1
    attn_dropout: 0.1
    mlp_ratio: 2.0
    input_already_log1p: true
    gene_encoder_type: universal_mlp
    gene_voc_path: ${oc.env:STPATH_GENE_VOC_PATH}
    lr: 0.001
    target_scale_floor: 0.05
training:
  epochs: 10000
  seed: 10
  mask_seed: 769000
  unique_mask_count: 256
  log_every_n_steps: 10
  log_print_every_n_steps: 500
  checkpoint_every_n_steps: 5000
  num_workers: 0
  augment_coords: false
  image_mode: target_zero
  context_gex_mode: full
  query_image_dropout_p: 0.0
  all_image_dropout_p: 0.0
  context_gex_dropout_p: 0.0
  gradient_clip_val: 1.0
  checkpoint_dir: results/checkpoints/lung_round/transport_lung_spatial_transformer_universal_gene_v1_10k
validation:
  enabled: true
  every_n_steps: 1000
  patience_checks: 1000
  early_stopping_min_steps: 10000
  require_anchor_improvement: false
  min_delta: 0.0001
  metric: rmse
  n_samples: 1
  sampling_seed: 869000
evaluation:
  mask_bank_dir: results/mask_banks/lung_round/transport_lung_v1_10k
  n_validation_masks: 8
  n_test_masks: 16
  validation_seed: 761000
  test_seed: 961000
  sampling_seed: 1261000
  n_samples: 1
  primary_image_mode: target_zero
  image_modes: [target_zero, all_zero]
  validation_image_mode: target_zero
  context_gex_mode: full
  k_neighborhood: 8
  pca_n_components: 50
  fixed_gene_panel_paths: {lung_hest_bench_50: resources/evaluation/hest_bench/LUNG_var_50genes.json}
  train_variance_gene_panel_sizes: [50, 200]
  training_mask_bank_path: results/mask_banks/training/lung_round/transport_lung_spatial_transformer_universal_gene_v1_10k_256_seed769000.json
logging:
  backend: csv
  project: st3d-lundeberg-lab
