# Lung round DIAGNOSTIC (2026-07-24): isolates hole-PLACEMENT effect.
# Identical to 304_lung_harmonic.yaml (same sample MEND85, same model,
# same radius/shape/n_patches) except masking.params.center_mode:
# geometric_median -- every hole is forced to sit at MEND85's own
# geometric-median spot (nearest observed spot to the coordinate-wise
# median), matching the reference STPath benchmark notebook's
# `choose_central_window`/`make_central_mask` placement rule, instead of
# our usual uniformly-random placement (which can land near edges/sparse
# tissue). If harmonic's PCC here jumps toward the notebook's ~0.29-0.33
# (vs 304's holefix result of ~0.008), that confirms hole PLACEMENT (not
# sample choice or a code bug) is the main remaining driver of the gap
# versus the notebook's numbers. Pair with 313 (stpath_official) for the
# same comparison on STPath itself, and 314/315 (TENX118, unchanged
# random placement) to separately isolate sample choice.
experiment_name: transport_lung_harmonic_central_mask_v1_holefix
data:
  source: hest1k
  hest_data_dir: data/raw/hest1k
  hest_cache_dir: data/cache/hest1k
  slide_context_source: disabled
  strict_broken_region: true
  query_patch_size_fullres: 224.0
  sample_ids: [TENX72, TENX62, MEND90, MEND89, MEND88, MEND87, MEND86, MEND85]
  train_sample_ids: [TENX72, TENX62, MEND90, MEND89, MEND88, MEND87]
  validation_sample_ids: [MEND86]
  test_sample_ids: [MEND85]
  holdout_unit: sample
  task: intra_slice
  task_contract: missing_tissue
  modality_ablation: both
  min_genes: 200
  min_cells: 3
  expression_transform: normalize_log1p
  expression_target_sum: 10000.0
  novae_mode: context_only
  require_image_coverage: true
  use_images: true
  organ_by_sample: {TENX72: Lung, TENX62: Lung, MEND90: Lung, MEND89: Lung, MEND88: Lung, MEND87: Lung, MEND86: Lung, MEND85: Lung}
  tech_by_sample: {TENX72: Visium, TENX62: Visium, MEND90: Visium, MEND89: Visium, MEND88: Visium, MEND87: Visium, MEND86: Visium, MEND85: Visium}
masking:
  strategy: random_dropout_patches
  max_context_points: 3000
  context_selection: nearest_query
  params:
    n_patches: 1
    radius_range: [5.0, 8.0]
    radius_unit: spot_spacing
    shape: mixed
    center_mode: geometric_median
model:
  name: spatial_baseline
  params:
    mode: harmonic
    k: 128
    ridge: 0.0001
training:
  epochs: 1
  seed: 10
  mask_seed: 780000
  unique_mask_count: 1
  log_every_n_steps: 10
  log_print_every_n_steps: 500
  checkpoint_every_n_steps: 5000
  num_workers: 0
  augment_coords: false
  image_mode: target_zero
  context_gex_mode: full
  query_image_dropout_p: 0.0
  all_image_dropout_p: 0.0
  context_gex_dropout_p: 0.0
  gradient_clip_val: 1.0
  checkpoint_dir: results/checkpoints/lung_round/transport_lung_harmonic_central_mask_v1_holefix
validation:
  enabled: false
evaluation:
  mask_bank_dir: results/mask_banks/lung_round/transport_lung_central_mask_v1_10k
  n_validation_masks: 8
  n_test_masks: 16
  validation_seed: 761000
  test_seed: 961000
  sampling_seed: 1261000
  n_samples: 1
  primary_image_mode: target_zero
  image_modes: [target_zero]
  validation_image_mode: target_zero
  context_gex_mode: full
  k_neighborhood: 8
  pca_n_components: 50
  fixed_gene_panel_paths: {lung_hest_bench_50: resources/evaluation/hest_bench/LUNG_var_50genes.json}
  train_variance_gene_panel_sizes: [50, 200]
logging:
  backend: csv
  project: st3d-lundeberg-lab
