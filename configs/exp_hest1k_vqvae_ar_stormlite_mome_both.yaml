# Cross-model-family generalization test (2026-07-17) — VQ-VAE +
# autoregressive transformer variant. See
# exp_hest1k_wae_gan_stormlite_mome_both.yaml's header for the full
# reasoning (identical, different generator family — discrete latent +
# autoregressive sampling this time, the third structurally distinct
# paradigm alongside FM-OT's flow matching and WAE-GAN's adversarial
# loop). Direct comparison target: exp_hest1k_vqvae_ar_stpath.yaml.
#
# Requires `pip install novae` (Python >=3.11).

experiment_name: vqvae_ar_hest1k_pilot_stormlite_mome_both

data:
  use_images: true
  source: hest1k
  hest_data_dir: data/raw/hest1k
  sample_id: INT1
  task: intra_slice
  min_genes: 200
  min_cells: 3

masking:
  strategy: random_dropout_patches
  params:
    n_patches: 3
    radius_range: [250, 450]

model:
  name: vqvae_ar
  params:
    context_encoder_type: storm_lite
    gene_encoder_type: both
    storm_lite_fusion_mode: mome
    # novae_dim is NOT set here — auto-injected from the real precomputed
    # Novae features' shape (see train.py inject_novae_dim / get_novae_features)
    storm_lite_n_layers: 2
    storm_lite_n_heads: 4
    n_genes: 16570
    coord_dim: 3
    cond_hidden_dim: 256           # also StormLiteContextEncoder's internal token dim
    latent_dim: 32
    ae_hidden_dim: 256
    codebook_size: 64
    commitment_weight: 0.25
    transformer_dim: 128
    n_transformer_layers: 4
    n_heads: 4
    max_seq_len: 2048
    recon_weight: 1.0
    ar_weight: 1.0
    sample_temperature: 1.0
    lr: 1.0e-3

training:
  epochs: 10000
  seed: 0
  log_every_n_steps: 10
  checkpoint_dir: results/checkpoints/${experiment_name}

evaluation:
  metrics: [pearson_per_gene, rmse, nonzero_auc, st_fid, st_mmd]
  embedding_for_fid: pca
  pca_n_components: 50

logging:
  backend: wandb
  project: st3d-lundeberg-lab
