# LLOKI-style decoder test (2026-07-17) on this project's overall best
# context encoder (pretrained STPath + bothresidual, PCC 0.41-0.47 across
# 10k/20k/40k). See exp_hest1k_fm_ot_stormlite_mome_both_lloki.yaml's
# header for the full LLOKI-CAE mechanism/source verification — identical
# decoder, different (stronger) context encoder, to see whether
# technology-conditioned decoding stacks with an already-strong fusion or
# only matters when the fusion itself is weak.
#
# Direct comparison target: exp_hest1k_fm_ot_stpath_bothresidual.yaml
# (dense decoder, PCC 0.4154 @ 10k).
#
# Requires `pip install novae` (Python >=3.11).

experiment_name: fm_ot_hest1k_pilot_stpath_bothresidual_lloki

data:
  use_images: true
  source: hest1k
  hest_data_dir: data/raw/hest1k
  sample_id: INT1
  task: intra_slice
  min_genes: 200
  min_cells: 3

masking:
  strategy: random_dropout_patches
  params:
    n_patches: 3
    radius_range: [250, 450]

model:
  name: fm_ot
  params:
    context_encoder_type: stpath
    stpath_gene_voc_path: ${oc.env:STPATH_GENE_VOC_PATH}
    stpath_model_weight_path: ${oc.env:STPATH_MODEL_WEIGHT_PATH}
    stpath_organ_type: Kidney      # INT1 is ccRCC (renal cell carcinoma)
    stpath_tech_type: Visium
    stpath_new_gene_encoder_type: both
    decoder_type: lloki             # 2026-07-17: see header
    # 2026-07-17 fix: load_adata never passes organ/tech into
    # load_hest_sample for single-sample configs, so adata.obs["tech"] is
    # always the literal string "unknown" here, not "Visium" — see
    # loaders.load_hest_sample's own organ/tech default handling. Real,
    # not a workaround: LLOKIStyleDecoder can only condition on values
    # that actually appear, and this is the one that does.
    tech_vocab: ["unknown"]
    decoder_lloki_tech_embed_dim: 10
    decoder_lloki_hidden_dims: [512, 256, 128]  # LLOKI-CAE's real published shape
    # stpath_novae_dim is NOT set here — auto-injected from the real
    # precomputed Novae features' shape (see train.py
    # inject_stpath_novae_dim / get_novae_features)
    n_genes: 16570                # INT1 after QC, same as exp_hest1k_fm_ot_stpath.yaml
    coord_dim: 3
    cond_hidden_dim: 256
    latent_dim: 32
    ae_hidden_dim: 256
    hidden_dim: 512
    time_embed_dim: 64
    n_ode_steps: 50
    recon_weight: 1.0
    fm_weight: 1.0
    lr: 1.0e-3

training:
  epochs: 10000
  seed: 0
  log_every_n_steps: 10
  checkpoint_dir: results/checkpoints/${experiment_name}

evaluation:
  metrics: [pearson_per_gene, rmse, nonzero_auc, st_fid, st_mmd]
  embedding_for_fid: pca
  pca_n_components: 50

logging:
  backend: wandb
  project: st3d-lundeberg-lab
