# Architecture 3: Hierarchical Slide-Boundary Field.
#
# Exactly Architecture 1's conditioner plus all-observed-GEX inducing
# tokens (use_global_gex: true), still anchor-free, PLUS regional WSI
# tokens and the mask-aware frozen GigaPath LongNet global token -- the
# fairness matrix's full spec for this architecture (Step 5 Part 2:
# "Architecture 3 enables both branches"). use_regional_he/use_global_slide
# are real and wired end to end (models/architectures.py's
# _regional_he_tokens/_global_slide_vector, consuming
# SpatialFieldInputs.wsi_tile_*/full_slide_coord_bounds/
# slide_cache_namespace -- populated by example_builder.py from a real
# slide_context.load_slide_context() cache).
#
# `slide_encoder`/`gigapath_checkpoint_sha256` are NOT set anywhere in
# this file: they are a live FrozenGigaPathSlideEncoder instance plus its
# checkpoint's real SHA256, neither of which is representable in static
# YAML. The real trainer (Step 6, not yet built) is responsible for
# constructing FrozenGigaPathSlideEncoder from the checkpoint path
# recorded in `required_fingerprints.gigapath_checkpoint` below, hashing
# it, and passing both into resolve_model_kwargs's output before
# construction -- resolve_model_kwargs/Architecture3.__init__ both fail
# CLOSED (raise ValueError) if use_global_slide=true and either is
# missing, so this config can never silently train with global slide
# conditioning disabled by omission. See architecture1.yaml's header for
# the shared-field/static-config-audit contract.

experiment_name: gen3_architecture3_hierarchical_slide_boundary_v1

documented_divergences:
  - model.architecture
  - model.params.use_anchor_blend
  - model.params.use_regional_he
  - model.params.use_global_gex
  - model.params.use_global_slide
  - training.checkpoint_dir

model:
  architecture: "3"
  params:
    n_genes: null
    gex_feature_dim: null
    image_feature_dim: 1536
    hidden_dim: 512
    n_heads: 8
    n_blocks: 4
    dense_threshold: 256
    sparse_k: 10
    chunk_size: 1024
    max_boundary_size: null
    transport_heads: 8
    transport_temperature: 1.0
    gene_gate_mode: per_gene
    use_query_gate: true
    use_residual: false
    residual_rank: 32
    use_anchor_blend: false
    use_regional_he: true       # real, wired -- Step 5 Part 2; see header note for slide_encoder/checksum caveat
    use_global_gex: true        # CONTRACT.md section 15
    use_global_slide: true      # real, wired -- Step 5 Part 2; see header note for slide_encoder/checksum caveat
    global_slide_dim: 768
    regional_grid_size: 4
    n_gex_inducing: 16
    harmonic_k_neighbors: 6
    gene_encoder_type: weighted_linear
    init_seed: 0

loss:
  gradient_weight: 0.05
  k_neighbors: 6

masking:
  strata:
    - name: small_compact
      radius_range: [3.0, 5.0]
      radius_unit: spot_spacing
      shape: circle
    - name: medium_compact
      radius_range: [5.0, 8.0]
      radius_unit: spot_spacing
      shape: circle
    - name: large_compact
      radius_range: [8.0, 12.0]
      radius_unit: spot_spacing
      shape: circle
    - name: medium_irregular
      radius_range: [5.0, 8.0]
      radius_unit: spot_spacing
      shape: mixed

data:
  hest_data_dir: data/raw/hest1k
  hest_cache_dir: data/cache/hest1k
  # use_regional_he/use_global_slide=true above need real WSI-tile
  # context (slide_context.load_slide_context) -- dense_wsi_cache is the
  # real, tissue-wide, non-overlapping tile grid (precompute_gigapath_wsi_tiles.py);
  # spot_aligned is an explicit DIAGNOSTIC fallback over the much sparser
  # ST-covered patch lattice and is never presented as complete WSI
  # coverage (slide_context.py's own docstring) -- production training
  # must use dense_wsi_cache, never spot_aligned (16th Codex re-audit).
  slide_context_source: dense_wsi_cache
  gen3_manifest_path: null   # path to a real, already-built dataset_manifest.py output -- set per deployment, not committed here
  tile_encoder_revision: null   # the experiment's pinned, immutable GigaPath Hugging Face commit SHA -- set per deployment
  gex_feature_dim: 256   # the shared GEX conditioning encoder's real output width (see model.params.gex_feature_dim's own null placeholder above)
  n_training_masks_per_sample: 500
  n_validation_masks: 4
  novae:
    enabled: false
  sample_selection:
    organs: all
    metadata_csv: hf://datasets/MahmoodLab/hest/HEST_v1_3_0.csv
    min_samples_per_organ: 5
    max_samples_per_organ: 30
    n_validation_per_organ: 2
    n_test_per_organ: 2
    split_seed: 0

evaluation:
  gene_panels:
    CCRCC_var_50genes: resources/evaluation/hest_bench/CCRCC_var_50genes.json
  compute_st_fid_mmd: false
  patient_level_aggregation: true

required_fingerprints:
  gigapath_checkpoint: null   # real checkpoint path REQUIRED before training -- use_global_slide=true now means Architecture3.__init__ raises ValueError without a real slide_encoder built from this checkpoint (see header note); still null because no real trainer/checkpoint deployment exists yet (Step 6)
  gene_vocabulary: null
  train_mask_bank: null
  validation_mask_bank: null
  test_mask_bank: null

training:
  device: cuda
  seed: 0
  lr: 1.0e-4
  total_steps: 100000000
  max_wall_clock_hours: 24
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  checkpoint_every_n_steps: 2000
  checkpoint_dir: gen3_multiscale/results/architecture3
  eval_every_n_steps: 2000
  synchronized_init_dir: null   # dir written by model_factory.persist_four_architecture_initializations -- required for any non-smoke run (train.py fails closed without it)
